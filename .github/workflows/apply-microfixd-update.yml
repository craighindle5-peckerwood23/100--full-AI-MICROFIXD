name: Apply verified Microfixd update

on:
  push:
    branches: [main]
    paths: [microfixd-update.txt]

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am microfixd-update.txt
          rm microfixd-update.txt .github/workflows/apply-microfixd-update.yml
          git add -A
          git commit -m "Remove one-time update installer"
          git push origin HEAD:main
